<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lernspiele</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root { --sky: #10171f; --panel: #1b2630; --line: #3a4b58; --fg: #eef3ec; --muted: #a7b6ad; --grass: #5fae3a; --diamond: #4fe0d6; color-scheme: dark; }
  body { margin: 0; background: var(--sky); color: var(--fg); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; font-size: 1.1rem; line-height: 1.5; padding: 24px 16px 48px; }
  .wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-family: "Pixelify Sans", monospace; font-size: 2.2rem; margin: 0; }
  a.game { display: flex; flex-direction: column; gap: 4px; background: var(--panel); border: 3px solid #0b1015; box-shadow: inset 0 8px 0 var(--grass); padding: 20px 16px 16px; color: var(--fg); text-decoration: none; }
  a.game:hover, a.game:focus-visible { outline: 3px solid var(--diamond); }
  a.game b { font-family: "Pixelify Sans", monospace; font-size: 1.4rem; font-weight: 500; }
  a.game span { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lernspiele</h1>
  <p>Deutsch: Nebensätze, Adverbialsätze und Satzglieder.</p>
  <a class="game" href="teil1.html"><b>Teil 1: Blockdorf in Gefahr</b><span>denn oder weil, damit oder sodass, Temporalsätze</span></a>
  <a class="game" href="teil2.html"><b>Teil 2: Die große Baustelle</b><span>Umformen, Satzglieder, verkleidete Konjunktionen</span></a>
</div>
</body>
</html>
